<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 280px;
      padding: 18px 16px 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #fff;
      color: #111;
    }

    .header {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 14px;
    }

    .icon { font-size: 26px; line-height: 1; }

    .title { font-size: 14px; font-weight: 700; line-height: 1.2; }
    .subtitle { font-size: 11px; color: #888; margin-top: 2px; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 20px;
      margin-bottom: 12px;
    }
    .badge.active { background: #e8f5e9; color: #2e7d32; }
    .badge.inactive { background: #f5f5f5; color: #999; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

    .device-card {
      background: #fafafa;
      border: 1px solid #eee;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 14px;
    }
    .device-name { font-size: 12px; font-weight: 600; margin-bottom: 4px; }
    .device-meta { font-size: 11px; color: #777; line-height: 1.5; }

    .layout-preview {
      display: flex;
      gap: 4px;
      align-items: stretch;
      margin-bottom: 14px;
      height: 52px;
    }
    .pane {
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-weight: 600;
      color: #fff;
      letter-spacing: 0.3px;
    }
    .pane.desktop { flex: 1; background: #333; }
    .pane.mobile { width: 38px; background: #FF9900; color: #111; }

    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:hover:not(:disabled) { opacity: 0.88; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }

    #splitBtn { background: #FF9900; color: #111; }
    #restoreBtn { background: #1a1a1a; color: #fff; display: none; }

    .status {
      text-align: center;
      font-size: 11px;
      color: #999;
      margin-top: 8px;
      min-height: 14px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="icon">📱</div>
    <div>
      <div class="title">Amazon Split View</div>
      <div class="subtitle">Desktop · Mobile side by side</div>
    </div>
  </div>

  <div class="badge inactive" id="badge">
    <span class="dot"></span>
    <span id="badgeText">Ready</span>
  </div>

  <div class="device-card">
    <div class="device-name">Amazon App · iPhone 15</div>
    <div class="device-meta">
      393 px wide &nbsp;·&nbsp; iOS 17 UA<br>
      AmazonApp/25.18.0.300
    </div>
  </div>

  <div class="layout-preview">
    <div class="pane desktop">DESKTOP</div>
    <div class="pane mobile">MOB</div>
  </div>

  <button id="splitBtn">Open Split View →</button>
  <button id="restoreBtn">Exit Split View</button>
  <div class="status" id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
